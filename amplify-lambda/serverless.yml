service: amplify-${self:custom.stageVars.DEP_NAME}-lambda

frameworkVersion: "3"

package:
  exclude:
    - node_modules/**
    - venv/**

plugins:
  - serverless-offline
  - serverless-python-requirements
  - serverless-prune-plugin
  # - serverless-domain-manager
  - serverless-cloudformation-changesets

layers:
  markitdown:
    path: markitdown
    name: ${self:service}-${sls:stage}-markitdown
    description: Markitdown layer
    compatibleRuntimes:
      - python3.11
      
custom:
  pythonRequirements:
    dockerizePip: false
    layer: true
    pythonBin: python3.11
    # uncomment in case of issues with pythonRequirement layers not uploading to aws 
    useStaticCache: false  # Uses a static path for the cache
    useDownloadCache: false 

  prune:
    automatic: true
    includeLayers: true
    number: 5

  cf-changesets:
    requireChangeSet: ${self:custom.stageVars.CHANGE_SET_BOOLEAN}

  stageVars: ${file(../var/${self:provider.stage}-var.yml)}
  allowedOrigin: ${self:custom.stageVars.ALLOWED_ORIGIN, 'https://hfu-amplify.org'}
  stages:
    - dev
    - staging
    - prod

  # customDomain:
  #   domainName: ${self:custom.stageVars.CUSTOM_API_DOMAIN}
    #certificateArn: ${self:custom.stageVars.SSL_CERT_ARN}
   #  certificateName:
   #  basePath: # optional, set to empty for the root path
   #  stage: ${self:provider.stage}
   # createRoute53Record: true # optional, default is false
   # autoDomain: true
   # autoDomainWaitFor: 60
    
provider:
  name: aws
  runtime: python3.11
  stage: ${opt:stage, 'dev'}
  region: ${self:custom.stageVars.DEP_REGION}
  versionFunctions: false 
  environment:
    #Local Resources Created in this service
    CHANGE_SET_BOOLEAN: ${self:custom.stageVars.CHANGE_SET_BOOLEAN}
    DYNAMODB_TABLE: ${self:service}-${sls:stage}
    ASSISTANTS_DYNAMODB_TABLE: ${self:service}-${sls:stage}-assistants
    FILES_DYNAMO_TABLE: ${self:service}-${sls:stage}-user-files
    USER_TAGS_DYNAMO_TABLE: ${self:service}-${sls:stage}-user-tags
    HASH_FILES_DYNAMO_TABLE: ${self:service}-${sls:stage}-hash-files
    ACCOUNTING_DYNAMO_TABLE: ${self:service}-${sls:stage}-accounting
    ACCOUNTS_DYNAMO_TABLE: ${self:service}-${sls:stage}-accounts
    CHAT_USAGE_DYNAMO_TABLE: ${self:service}-${sls:stage}-chat-usage
    CHAT_USAGE_ARCHIVE_DYNAMO_TABLE: ${self:service}-${sls:stage}-chat-usage-archive
    COST_CALCULATIONS_DYNAMO_TABLE: ${self:service}-${sls:stage}-cost-calculations
    S3_ACCESS_LOGS_BUCKET_NAME: amp-${sls:stage}-access-logs-${sls:instanceId}
    LAMBDA_IAM_POLICY_NAME: ${self:service}-${sls:stage}-lambda-policy
    S3_BUCKET_NAME: amp-${sls:stage}-share-${sls:instanceId}  
    S3_CONVERSION_INPUT_BUCKET_NAME: amp-${sls:stage}-doc-conversion-input-${sls:instanceId}
    S3_CONVERSION_OUTPUT_BUCKET_NAME: amp-${sls:stage}-doc-conversion-output-${sls:instanceId}
    S3_ASSISTANT_UPLOADS_BUCKET_NAME: amp-${sls:stage}-assistant-uploads-${sls:instanceId}
    S3_IMAGE_INPUT_BUCKET_NAME: amp-${sls:stage}-image-input-${sls:instanceId}
    S3_RAG_INPUT_BUCKET_NAME: amp-${sls:stage}-rag-input-${sls:instanceId}
    S3_RAG_CHUNKS_BUCKET_NAME: amp-${sls:stage}-rag-chunks-${sls:instanceId}
    S3_FILE_TEXT_BUCKET_NAME: amp-${sls:stage}-file-text-${sls:instanceId}
    SQS_RAG_DOCUMENT_INDEX_QUEUE: ${self:service}-${sls:stage}-rag-document-index-queue
    SQS_RAG_CHUNK_DOCUMENT_INDEX_QUEUE: ${self:service}-${sls:stage}-rag-document-chunk-queue
    EMBEDDING_PROGRESS_TABLE: amplify-${self:custom.stageVars.DEP_NAME}-embedding-${sls:stage}-embedding-progress
    OBJECT_ACCESS_DYNAMODB_TABLE: amplify-${self:custom.stageVars.DEP_NAME}-object-access-${sls:stage}-object-access
    S3_CONVERSATIONS_BUCKET_NAME:  amp-${sls:stage}-user-conversations-${sls:instanceId}
    S3_ZIP_FILE_BUCKET_NAME: amp-${sls:stage}-zip-files-${sls:instanceId}
    API_KEYS_DYNAMODB_TABLE: amplify-${self:custom.stageVars.DEP_NAME}-object-access-${sls:stage}-api-keys
    CONVERSATION_METADATA_TABLE: ${self:service}-${sls:stage}-conversation-metadata
    API_BASE_URL: https://${self:custom.stageVars.CUSTOM_API_DOMAIN}/
    MAX_CHUNKS: 1000
    PANDOC_LAYER: ${self:custom.stageVars.PANDOC_LAMBDA_LAYER_ARN}  
    IDP_PREFIX: ${self:custom.stageVars.IDP_PREFIX}
    OAUTH_AUDIENCE: ${self:custom.stageVars.OAUTH_AUDIENCE}
    OAUTH_ISSUER_BASE_URL: ${self:custom.stageVars.OAUTH_ISSUER_BASE_URL}
    
    OBJECT_S3_PERMISSION_TABLE: amplify-${self:custom.stageVars.DEP_NAME}-object-access-${sls:stage}-object-s3-permissions
    COGNITO_GROUP_TABLE: amplify-${self:custom.stageVars.DEP_NAME}-object-access-${sls:stage}-user-groups
    AMPLIFY_DATA_BUCKET: amp-${sls:stage}-data-${sls:instanceId}

    CHAT_BILLING_DYNAMODB_TABLE: amplify-${self:custom.stageVars.DEP_NAME}-chat-billing-${sls:stage}-chat-billing
    MODEL_RATE_TABLE_NAME: amplify-${self:custom.stageVars.DEP_NAME}-chat-billing-${sls:stage}-model-rate-table
    
    STATE_MACHINE_ARN_CONVERSATION: arn:aws:states:${aws:region}:${aws:accountId}:stateMachine:amplify-${self:custom.stageVars.DEP_NAME}-lambda-ops-${sls:stage}-conversation
  tracing:
    lambda: true  
  iam:
    role:
      managedPolicies:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole      
        - arn:aws:iam::${aws:accountId}:policy/${self:provider.environment.LAMBDA_IAM_POLICY_NAME}

functions:

  # JWT Authorizer function
  jwtAuthorizer:
    handler: auth/jwt_authorizer.lambda_handler
    environment:
      COGNITO_ISSUER: ${self:custom.stageVars.OAUTH_ISSUER_BASE_URL}
      ACCOUNTS_DYNAMO_TABLE: ${self:provider.environment.ACCOUNTS_DYNAMO_TABLE}
      IDP_PREFIX: ${self:custom.stageVars.IDP_PREFIX}
