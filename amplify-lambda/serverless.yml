  Outputs:
    ApiGatewayId:
      Value:
        Ref: ApiGatewayRestApi
      Export:
        Name: ${sls:stage}-RestApiId

    ApiGatewayRootResourceId:
      Value:
        Fn::GetAtt:
          - ApiGatewayRestApi
          - RootResourceId
      Export:
        Name: ${sls:stage}-RestApiRootResourceId

    RestApiUrl:
      Value:
        Fn::Join:
          - ""
          - - "https://"
            - Ref: ApiGatewayRestApi
            - ".execute-api.${aws:region}.amazonaws.com/${sls:stage}"
      Export:
        Name: ${sls:stage}-RestApiUrl