    S3BucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: ${self:provider.environment.S3_BUCKET_NAME}
        PolicyDocument:
          Statement:
            - Action:
                - "s3:PutObject"
              Effect: Deny
              Resource:
                - !Sub "arn:aws:s3:::${self:provider.environment.S3_BUCKET_NAME}/*"
              Principal: "*"
              Condition:
                StringNotEquals:
                  s3:x-amz-server-side-encryption: "AES256"
    
