resources:
  Description: Amplify Managed State Service 
  Resources:
    LambdaIAMPolicy:
      Type: AWS::IAM::ManagedPolicy
      Properties:
        ManagedPolicyName: ${self:provider.environment.LAMBDA_IAM_POLICY_NAME}
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
                - ssm:DescribeParameters
                - ssm:PutParameter
              Resource: 
                - arn:aws:ssm:${self:provider.region}:${aws:accountId}:parameter/${self:service}/${sls:stage}/s3/metadata/encryption        
            - Effect: Allow
              Action:
                - ssm:GetParameter
              Resource: 
                - arn:aws:ssm:${self:provider.region}:${aws:accountId}:*                
            - Effect: Allow
              Action:
                - s3:ListBucket
                - s3:GetObject
                - s3:PutObject
                - s3:DeleteObject
              Resource:
                - "arn:aws:s3:::${self:provider.environment.S3_CONVERSATIONS_BUCKET_NAME}"
                - "arn:aws:s3:::${self:provider.environment.S3_CONVERSATIONS_BUCKET_NAME}/*"
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
                - dynamodb:Query
                - dynamodb:Scan
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - s3:GetObject
                - s3:PutObject
                - s3:PutObjectHold
                - s3:DeleteObject
                - s3:ListBucket
                - s3:CreateBucket
                - s3:PutBucketNotification
                - sqs:SendMessage
                - sqs:DeleteMessage
                - sqs:ReceiveMessage
                - sqs:GetQueueAttributes
                - sqs:ChangeMessageVisibility
                - rds-data:ExecuteStatement
                - rds-data:BatchExecuteStatement
              Resource: "*"
              
    UserStateDynamoDbTable:
      Type: AWS::DynamoDB::Table
      Properties:
        AttributeDefinitions:
          - AttributeName: user
            AttributeType: S
          - AttributeName: key_object
            AttributeType: S
        KeySchema:
          - AttributeName: user
            KeyType: HASH
