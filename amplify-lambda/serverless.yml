            name: jwtAuthorizer
            resultTtlInSeconds: 300
    environment:
        FILE_UPLOAD_ENCRYPTION_PARAMETER: /${self:service}/${sls:stage}/s3/metadata/encryption #must start with /
    timeout: 9    

  download_file:
