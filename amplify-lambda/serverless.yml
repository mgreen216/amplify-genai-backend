            Fn::GetAtt:
              - RagDocumentIndexQueue
              - Arn
    environment:
      FILE_UPLOAD_ENCRYPTION_PARAMETER: /${self:service}/${sls:stage}/s3/metadata/encryption
      rag_process_document_queue_url:
        Ref: RagDocumentIndexQueue

  queue_document_for_chunking:
