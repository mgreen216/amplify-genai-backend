            resultTtlInSeconds: 300
      
  chat_convert:
    handler: chat/convert.convert_endpoint
    layers:
      - ${self:custom.stageVars.PANDOC_LAMBDA_LAYER_ARN}
      - Ref: PythonRequirementsLambdaLayer
      - Ref: MarkitdownLambdaLayer
    memorySize: 256
    timeout: 120
    events:
      - http:
          path: chat/convert
          method: post
          authorizer:
            name: jwtAuthorizer
            resultTtlInSeconds: 300
    environment:
      TEMP_DIR: /tmp/

  # Retained production workloads. These handlers and their event sources are
  # still live; omitting them makes CloudFormation delete the functions, SQS
  # mappings, S3 notifications, and weekly archive schedule.
  create:
    handler: state/create.create
    layers:
      - Ref: PythonRequirementsLambdaLayer
    events:
      - http:
          path: state
          method: post
          cors: true

  convert:
    handler: converters/docconverter.handler
    layers:
      - ${self:provider.environment.PANDOC_LAYER}
      - Ref: PythonRequirementsLambdaLayer
    memorySize: 1024
    timeout: 180
    events:
      - s3:
          bucket: ${self:provider.environment.S3_CONVERSION_INPUT_BUCKET_NAME}
          event: s3:ObjectCreated:*
          existing: true

  handlePptxUpload:
    handler: powerpoints/core.handle_pptx_upload
    layers:
      - Ref: PythonRequirementsLambdaLayer
    events:
      - s3:
          bucket: ${self:provider.environment.S3_CONVERSION_OUTPUT_BUCKET_NAME}
          event: s3:ObjectCreated:*
          existing: true
          rules:
            - prefix: templates/
            - suffix: .pptx

  queue_document_for_rag:
