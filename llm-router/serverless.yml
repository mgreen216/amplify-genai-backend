service: llm-router

provider:
  name: aws
  runtime: python3.11
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-east-1'}
  stackName: ${self:service}-${self:provider.stage}
  versionFunctions: false
  apiGateway:
    restApiId:
      Fn::ImportValue: !Sub "${sls:stage}-RestApiId"
    restApiRootResourceId:
      Fn::ImportValue: !Sub "${sls:stage}-RestApiRootResourceId"

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - secretsmanager:GetSecretValue
          Resource:
            - arn:aws:secretsmanager:${self:provider.region}:*:secret:${self:provider.stage}-llm-api-keys-*
        - Effect: Allow
          Action:
            - bedrock:InvokeModel
            - bedrock:InvokeModelWithResponseStream
          Resource:
            - arn:aws:bedrock:${self:provider.region}::foundation-model/*
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:Query
          Resource:
            - "Fn::Sub": "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${self:provider.stage}-usage"
            - "Fn::Sub": "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${self:provider.stage}-usage/index/*"
  environment:
    STAGE: ${self:provider.stage}
    REGION: ${self:provider.region}
    SECRET_NAME: ${self:provider.stage}-llm-api-keys

functions:
  proxy:
    handler: service.core.handler
    memorySize: 3008
    timeout: 300
    events:
      - http:
          path: ${self:provider.stage}/proxy/llm
          method: post
          cors:
            origin: ${self:custom.allowedOrigin}
            headers:
              - Content-Type
              - Authorization
              - X-Amz-Date
              - X-Api-Key
              - X-Amz-Security-Token
            allowCredentials: true
          authorizer: aws_iam

plugins:
  - serverless-python-requirements

custom:
  allowedOrigin: ${env:ALLOWED_ORIGIN, 'https://hfu-amplify.org'}
  pythonRequirements:
    dockerizePip: false

resources:
  Resources:
    LLMApiKeysSecret:
      Type: AWS::SecretsManager::Secret
      Properties:
        Name: ${self:provider.stage}-llm-api-keys
        Description: API keys for external LLM providers (OpenAI, Gemini)
        SecretString: |
          {
            "openai_api_key": "YOUR_OPENAI_API_KEY",
            "gemini_api_key": "YOUR_GEMINI_API_KEY"
          }
        Tags:
          - Key: Environment
            Value: ${self:provider.stage}
          - Key: Service
            Value: llm-router
